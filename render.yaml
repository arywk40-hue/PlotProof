services:
  - type: web
    name: plotproof-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: plotproof-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: NODE_OPTIONS
        value: --experimental-sqlite
      - key: PINATA_JWT
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PLOTPROOF_DB_PATH
        value: /var/data/plotproof.sqlite
