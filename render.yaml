services:
  - type: web
    name: plotproof-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: NODE_OPTIONS
        value: --experimental-sqlite
      - key: PINATA_JWT
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PLOTPROOF_DB_PATH
        # Demo only: Render clears this file on restart, redeploy, or sleep.
        value: /tmp/plotproof.sqlite
